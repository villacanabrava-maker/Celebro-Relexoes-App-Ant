# Configuração local reproduzível do Supabase.
# Não contém segredos. Credenciais privadas devem permanecer em variáveis de ambiente.

project_id = "xwpfigystolwauglpukd"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public", "aplicacao"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
